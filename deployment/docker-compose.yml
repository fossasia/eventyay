name: eventyay-next

services:
  web:
    image: eventyay/eventyay-next:${TAG}
    container_name: eventyay-next-web
    command: gunicorn eventyay.config.wsgi:application --bind 0.0.0.0:8000 --worker-class gthread --workers 2 --threads 4 --timeout 60 --graceful-timeout 30 --max-requests 1000 --max-requests-jitter 100
    volumes:
      - ${DATA_DIR:-./data}/static:/home/app/web/eventyay/static.dist
      - ${DATA_DIR:-./data}/data:/home/app/web/eventyay/data
    ports:
      - 8000:8000
    expose:
      - 8000
    env_file:
      - ./.env
    environment:
      - MAX_CONCURRENT_REQUESTS=4
    depends_on:
      - db
      - redis

  websocket:
    image: eventyay/eventyay-next:${TAG}
    container_name: eventyay-next-websocket
    entrypoint: daphne -b 0.0.0.0 -p 8001 --proxy-headers --verbosity 0 eventyay.config.asgi:application
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - ${DATA_DIR:-./data}/static:/home/app/web/eventyay/static.dist
      - ${DATA_DIR:-./data}/data:/home/app/web/eventyay/data
    ports:
      - 8001:8001
    expose:
      - 8001
    env_file:
      - ./.env
    environment:
      - MPLCONFIGDIR=/tmp/matplotlib
      - MALLOC_ARENA_MAX=2
    depends_on:
      - db
      - redis

  worker:
    image: eventyay/eventyay-next:${TAG}
    container_name: eventyay-next-worker
    entrypoint: celery -A eventyay worker -l info -Q default,notifications
    volumes:
      - ${DATA_DIR:-./data}/static:/home/app/web/eventyay/static.dist
      - ${DATA_DIR:-./data}/data:/home/app/web/eventyay/data
    env_file:
      - ./.env
    environment:
      - MPLCONFIGDIR=/tmp/matplotlib
    depends_on:
      - db
      - redis

  worker-heavy:
    # Required in production: processes longrunning/background queues (badges, exports, imports).
    image: eventyay/eventyay-next:${TAG}
    container_name: eventyay-next-worker-heavy
    entrypoint: celery -A eventyay worker -l info -Q longrunning,background -c 1 --prefetch-multiplier=1 --max-tasks-per-child=200
    volumes:
      - ${DATA_DIR:-./data}/static:/home/app/web/eventyay/static.dist
      - ${DATA_DIR:-./data}/data:/home/app/web/eventyay/data
    env_file:
      - ./.env
    environment:
      - MPLCONFIGDIR=/tmp/matplotlib
    depends_on:
      - db
      - redis

  beat:
    image: eventyay/eventyay-next:${TAG}
    container_name: eventyay-next-beat
    entrypoint: celery -A eventyay beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ${DATA_DIR:-./data}/static:/home/app/web/eventyay/static.dist
      - ${DATA_DIR:-./data}/data:/home/app/web/eventyay/data
    env_file:
      - ./.env
    environment:
      - MPLCONFIGDIR=/tmp/matplotlib
    depends_on:
      - db
      - redis

  db:
    image: postgres:15
    container_name: eventyay-next-db
    volumes:
      - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql/data/
    env_file:
      - ./.env

  redis:
    image: redis:latest
    container_name: eventyay-next-redis
    restart: unless-stopped
    volumes:
      - rd:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]

  watchtower:
    image: nickfedor/watchtower
    container_name: eventyay-next-watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always
    environment:
      WATCHTOWER_NOTIFICATIONS: 'shoutrrr'
      WATCHTOWER_NOTIFICATIONS_HOSTNAME: ${WATCHTOWER_NOTIFICATIONS_HOSTNAME}
      WATCHTOWER_POLL_INTERVAL: 600
      WATCHTOWER_NOTIFICATION_URL: ${WATCHTOWER_NOTIFICATION_URL}
    command: watchtower eventyay-next-watchtower eventyay-next-web eventyay-next-websocket eventyay-next-worker eventyay-next-worker-heavy eventyay-next-beat --cleanup

volumes:
  rd:
