<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventyay Widgets Demo</title>
    

    
    <!-- Ticket Shop Widget Styles & Script -->
    <link rel="stylesheet" type="text/css" href="https://dev.eventyay.com/TG/baremini/widget/v1.css">
    <script type="text/javascript" src="https://dev.eventyay.com/widget/v1.en.js" async></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 2rem;
            background-color: #f9fafb;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        h1 {
            text-align: center;
            color: #111827;
            margin-bottom: 2rem;
        }
        .widget-section {
            margin-bottom: 4rem;
        }
        .widget-section h2 {
            border-bottom: 3px solid #ff9a00;
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
            color: #374151;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Eventyay Baremini Event</h1>
        


        <div class="widget-section">
            <h2>Tickets</h2>
            <!-- Ticket Shop Widget Embed -->
            <eventyay-widget event="https://dev.eventyay.com/TG/baremini/"></eventyay-widget>
            <noscript>
               <div class="pretix-widget">
                    <div class="pretix-widget-info-message">
                        JavaScript is disabled in your browser. To access our ticket shop without JavaScript, please <a target="_blank" rel="noopener" href="https://dev.eventyay.com/TG/baremini/">click here</a>.
                    </div>
                </div>
            </noscript>
        </div>
    </div>
</body>
</html>
