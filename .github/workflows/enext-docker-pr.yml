name: Docker PR Build (dev/main)

on:
  pull_request:
    branches: [ dev, main ]

jobs:
  check_translations:
    name: Validate translation files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install gettext
        run: sudo apt-get update -qq && sudo apt-get install -y gettext

      - name: Check .po files with msgfmt
        run: |
          failed=0
          while IFS= read -r f; do
            if ! msgfmt --check-format "$f" -o /dev/null; then
              echo "FAIL: $f"
              failed=1
            fi
          done < <(find app/eventyay/locale -name '*.po')
          if [ $failed -ne 0 ]; then
            echo "One or more .po files failed msgfmt validation."
            exit 1
          fi
          echo "All .po files passed msgfmt validation."

  build_docker_image:
    name: Build Docker image for PR
    runs-on: ubuntu-latest
    needs: check_translations
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      # Determine build mode based on PR target branch:
      # - PRs targeting dev: refresh plugins to latest branch commits
      # - PRs targeting main: use locked/pinned dependencies
      - name: Set build mode
        id: build_mode
        run: |
          if [ "${{ github.base_ref }}" = "dev" ]; then
            echo "mode=dev" >> "$GITHUB_OUTPUT"
            echo "cache_bust=$(date +%s)" >> "$GITHUB_OUTPUT"
          else
            echo "mode=production" >> "$GITHUB_OUTPUT"
            echo "cache_bust=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Docker image
        uses: docker/build-push-action@5cd11c3a4ced054e52742c5fd54dca954e0edd85
        with:
          context: ./app
          file: ./app/Dockerfile.prod
          push: false
          tags: eventyay-next:${{ github.sha }}
          build-args: |
            GITHUB_TOKEN=${{ secrets.EVENTYAY_TOKEN }}
            BUILD_MODE=${{ steps.build_mode.outputs.mode }}
            CACHE_BUST=${{ steps.build_mode.outputs.cache_bust }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
