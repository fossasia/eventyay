# .github/workflows/approval-labels.yml
#
# Keeps the "approvals: 1/3" and "approvals: 2/3" labels in sync with the number of
# approvals a PR has from people with write access to the repo.
#
# How it counts:
#   - For each reviewer, only their latest APPROVED / CHANGES_REQUESTED / DISMISSED
#     review counts (a later plain comment does not cancel an approval).
#   - The reviewer must currently have write, maintain or admin permission.
#   - 0 approvals  -> both labels removed
#     1 approval   -> "approvals: 1/3"
#     2 approvals  -> "approvals: 2/3"
#     3 or more    -> both labels removed (the PR has all required approvals)
#
# Runs after "Approval labels trigger" (review submitted / dismissed). That split is
# needed because review events on fork PRs only get a read-only token. This workflow
# never checks out or runs PR code; it only reads reviews through the API.
#
# Manual run: Actions -> Approval labels -> Run workflow, with a PR number (backfill).

name: Approval labels

on:
  workflow_run:
    workflows: ["Approval labels trigger"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr-number:
        description: PR number to relabel
        required: true
        type: string

permissions:
  pull-requests: write # enough to read reviews and add/remove labels

concurrency:
  group: approval-labels-${{ github.event.workflow_run.head_repository.full_name || 'manual' }}-${{ github.event.workflow_run.head_branch || inputs.pr-number }}
  cancel-in-progress: false

env:
  REQUIRED_APPROVALS: "3"
  LABEL_PREFIX: "approvals: " # labels are "approvals: 1/3", "approvals: 2/3"

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const REQUIRED = Number(process.env.REQUIRED_APPROVALS);
            const PREFIX = process.env.LABEL_PREFIX;
            const WRITE_LEVELS = ['admin', 'write']; // "maintain" is reported as "write"

            // 1. Find the PR(s) to update.
            let prNumbers = [];
            if (context.eventName === 'workflow_dispatch') {
              const n = Number(context.payload.inputs['pr-number']);
              if (!Number.isInteger(n) || n <= 0) {
                core.setFailed(`Invalid PR number: ${context.payload.inputs['pr-number']}`);
                return;
              }
              prNumbers = [n];
            } else {
              const run = context.payload.workflow_run;
              // Filled for same-repo PRs; empty for forks.
              prNumbers = (run.pull_requests ?? [])
                .filter(p => p.base.repo.id === run.repository.id)
                .map(p => p.number);
              if (prNumbers.length === 0 && run.head_repository) {
                const { data } = await github.rest.pulls.list({
                  owner, repo, state: 'open',
                  head: `${run.head_repository.owner.login}:${run.head_branch}`,
                  per_page: 100,
                });
                prNumbers = data.map(p => p.number);
              }
            }
            if (prNumbers.length === 0) {
              core.info('No open pull request found for this run, nothing to do');
              return;
            }

            // Permission lookups are cached across PRs in this run.
            const permCache = new Map();
            const hasWriteAccess = async username => {
              if (!permCache.has(username)) {
                try {
                  const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                    owner, repo, username,
                  });
                  permCache.set(username, WRITE_LEVELS.includes(data.permission));
                } catch (error) {
                  if (error.status !== 404) throw error;
                  permCache.set(username, false); // not a collaborator
                }
              }
              return permCache.get(username);
            };

            for (const n of prNumbers) {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: n });
              if (pr.state !== 'open') {
                core.info(`#${n} is ${pr.state}, skipping`);
                continue;
              }

              // 2. Latest decisive review per reviewer (reviews come oldest first).
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner, repo, pull_number: n, per_page: 100,
              });
              const latest = new Map();
              for (const r of reviews) {
                if (!r.user || r.user.login === pr.user.login) continue;
                if (['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(r.state)) {
                  latest.set(r.user.login, r.state);
                }
              }

              // 3. Count approvals from people with write access.
              const approvers = [];
              for (const [login, state] of latest) {
                if (state === 'APPROVED' && await hasWriteAccess(login)) approvers.push(login);
              }
              const count = approvers.length;
              core.info(`#${n}: ${count} qualifying approval(s) [${approvers.join(', ')}]`);

              // 4. Sync labels: exactly one "approvals: k/N" label while 0 < k < N.
              const wanted = count > 0 && count < REQUIRED ? `${PREFIX}${count}/${REQUIRED}` : null;
              const current = pr.labels.map(l => l.name);
              const managed = new RegExp(`^${PREFIX.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\d+/${REQUIRED}$`);

              for (const name of current) {
                if (managed.test(name) && name !== wanted) {
                  try {
                    await github.rest.issues.removeLabel({ owner, repo, issue_number: n, name });
                    core.info(`#${n}: removed "${name}"`);
                  } catch (error) {
                    if (error.status !== 404) throw error; // already gone
                  }
                }
              }
              if (wanted && !current.includes(wanted)) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: n, labels: [wanted] });
                core.info(`#${n}: added "${wanted}"`);
              }
            }
