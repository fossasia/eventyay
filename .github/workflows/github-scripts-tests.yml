# Runs the unit tests for the helper modules in .github/scripts/ (used by
# github-script workflows). Tests use node:test with a fake GitHub client, so they
# need no token and no network.

name: GitHub scripts tests

on:
  pull_request:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/github-scripts-tests.yml"
  push:
    branches: [dev, main]
    paths:
      - ".github/scripts/**"
      - ".github/workflows/github-scripts-tests.yml"

permissions:
  contents: read

concurrency:
  # PRs: a new push cancels checks still running for older commits of the same PR.
  # Branch pushes: grouped per commit, so they never cancel or replace each other.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - run: node --test .github/scripts/*.test.mjs
