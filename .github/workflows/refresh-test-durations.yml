name: Refresh stable test durations

# Runs the whole stable suite in one job every week and records fresh
# app/tests/stable/.test_durations for pytest-split. When the refreshed file
# would make the slowest shard of "Video & Backend CI" noticeably faster, it
# opens (or updates) a pull request with the new file. Entries for deleted
# tests are dropped (--clean-durations), so the file only lists current tests.
on:
  schedule:
    # Mondays 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Open the pull request even if the slowest shard gets only a little faster"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  SPLITS: 4
  # Seconds the slowest shard must get faster before a pull request is opened.
  MIN_GAIN_SECONDS: 15

jobs:
  store-durations:
    name: Store stable test durations
    # Forks inherit the schedule; only the main repository refreshes on it.
    # Manual runs work anywhere.
    if: github.event_name != 'schedule' || github.repository == 'fossasia/eventyay'
    runs-on: ubuntu-latest
    outputs:
      refresh: ${{ steps.drift.outputs.refresh }}
      baseline: ${{ steps.baseline.outputs.sha256 }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eventyay
          POSTGRES_PASSWORD: eventyay
          POSTGRES_DB: eventyay-db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U eventyay -d eventyay-db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          persist-credentials: false

      - name: Install system packages (gettext)
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: app/uv.lock

      - name: Sync dependencies (including test group)
        run: uv sync --directory app --group test

      - name: Keep the committed durations
        id: baseline
        run: |
          cp app/tests/stable/.test_durations "$RUNNER_TEMP/committed_durations.json"
          echo "sha256=$(sha256sum app/tests/stable/.test_durations | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Run pytest and store durations
        env:
          EVY_POSTGRES_USER: eventyay
          EVY_POSTGRES_PASSWORD: eventyay
          EVY_POSTGRES_DB: eventyay-db
          EVY_POSTGRES_HOST: localhost
          EVY_POSTGRES_PORT: "5432"
          EVY_REDIS_URL: redis://localhost:6379/0
          EVY_SECRET_KEY: ci-test-secret-key
          EVY_DEBUG: "true"
          EVY_RUNNING_ENVIRONMENT: testing
          DJANGO_SETTINGS_MODULE: eventyay.config.settings
        working-directory: app
        run: >-
          uv run pytest tests/stable --tb=short
          --store-durations --clean-durations --durations-path tests/stable/.test_durations

      - name: Compare shard times
        id: drift
        env:
          EVY_SECRET_KEY: ci-test-secret-key
          EVY_DEBUG: "true"
          EVY_RUNNING_ENVIRONMENT: testing
          DJANGO_SETTINGS_MODULE: eventyay.config.settings
          FORCE: ${{ inputs.force && '--force' || '' }}
          OUT: ${{ runner.temp }}/durations
        working-directory: app
        run: |
          mkdir -p "$OUT"
          cp tests/stable/.test_durations "$OUT/test_durations.json"
          # Collection order decides how pytest-split chunks the suite.
          uv run pytest tests/stable --collect-only -q -p no:warnings > "$RUNNER_TEMP/nodeids.txt"
          uv run python ../.github/scripts/test_durations_drift.py \
            "$RUNNER_TEMP/committed_durations.json" "$OUT/test_durations.json" "$RUNNER_TEMP/nodeids.txt" \
            --splits "$SPLITS" --min-gain "$MIN_GAIN_SECONDS" \
            --summary "$OUT/summary.md" $FORCE | tee "$RUNNER_TEMP/drift.txt"
          cat "$OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"
          grep '^refresh=' "$RUNNER_TEMP/drift.txt" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: stable-test-durations
          path: ${{ runner.temp }}/durations/

  open-pull-request:
    name: Open durations pull request
    needs: store-durations
    if: needs.store-durations.outputs.refresh == 'true'
    runs-on: ubuntu-latest
    # Only this job can write, and it runs no project code.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev

      - uses: actions/download-artifact@v7
        with:
          name: stable-test-durations
          path: ${{ runner.temp }}/durations

      - name: Check the baseline is unchanged
        id: current
        env:
          BASELINE: ${{ needs.store-durations.outputs.baseline }}
        run: |
          # The comparison was made against the file the suite ran with. If dev got
          # a newer durations file meanwhile, that comparison no longer holds, so
          # skip instead of overwriting it; the next run compares against it.
          current=$(sha256sum app/tests/stable/.test_durations | cut -d' ' -f1)
          if [ "$current" = "$BASELINE" ]; then
            echo "unchanged=true" >> "$GITHUB_OUTPUT"
          else
            echo "unchanged=false" >> "$GITHUB_OUTPUT"
            echo "::warning::app/tests/stable/.test_durations changed on dev during this run; not opening a pull request. Run the workflow again to compare against the new file."
          fi

      - name: Copy refreshed durations
        if: steps.current.outputs.unchanged == 'true'
        id: summary
        run: |
          cp "$RUNNER_TEMP/durations/test_durations.json" app/tests/stable/.test_durations
          {
            echo "body<<EOF"
            cat "$RUNNER_TEMP/durations/summary.md"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update pull request
        if: steps.current.outputs.unchanged == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          # Pull requests opened with GITHUB_TOKEN do not start other workflows.
          # Set the DURATIONS_PR_TOKEN secret (a token with contents and
          # pull-requests write access) to have CI run on this pull request.
          token: ${{ secrets.DURATIONS_PR_TOKEN || secrets.GITHUB_TOKEN }}
          branch: chore/refresh-test-durations
          base: dev
          add-paths: app/tests/stable/.test_durations
          commit-message: Refresh stable test durations
          title: Refresh stable test durations
          body: |
            Updates `app/tests/stable/.test_durations`, which pytest-split uses to balance the integration test shards in "Video & Backend CI".

            ${{ steps.summary.outputs.body }}

            ---

            Opened automatically by the [Refresh stable test durations](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) workflow. Merging needs no other changes; a newer run updates this pull request in place.
          delete-branch: true
