name: Docker
on:
  workflow_dispatch:
  push:
    branches: [ dev, main ]

jobs:
  push_to_registry:
    name: Push Docker image to Docker hub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@98669ae865ea3cffbcbaa878cf57c20bbf1c6c38
        with:
          images: eventyay/eventyay-next

      # Determine build mode based on branch:
      # - dev branch: refresh plugins to latest branch commits
      # - main branch: use locked/pinned dependencies
      - name: Set build mode
        id: build_mode
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            echo "mode=dev" >> "$GITHUB_OUTPUT"
            echo "cache_bust=$(date +%s)" >> "$GITHUB_OUTPUT"
          else
            echo "mode=production" >> "$GITHUB_OUTPUT"
            echo "cache_bust=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@ad44023a93711e3deb337508980b4b5e9bcdc5dc
        with:
          context: ./app
          file: ./app/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GITHUB_TOKEN=${{ secrets.EVENTYAY_TOKEN }}
            BUILD_MODE=${{ steps.build_mode.outputs.mode }}
            CACHE_BUST=${{ steps.build_mode.outputs.cache_bust }}
