{% extends 'pretixcontrol/admin/base.html' %}
{% load bootstrap3 i18n %}
{% block title %}{{ title }}{% endblock %}
{% block video_admin_content %}
  <h1>{{ title }}</h1>
  <form method="post" class="form-horizontal">
    {% csrf_token %}
    {% bootstrap_form form layout='control' %}
    <div class="form-group submit-group">
      <a href="{% url 'eventyay_admin:admin.organizer_forms' %}" class="btn btn-default">{% trans 'Cancel' %}</a>
      <button type="submit" class="btn btn-primary btn-save">{% trans 'Save' %}</button>
    </div>
  </form>
{% endblock %}
