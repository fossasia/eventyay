{% load i18n %}
{% if assignment and assignment.voucher_id %}
    {% with code=assignment.voucher.code sent_at=assignment.sent_at %}
        <span class="speaker-voucher-info-wrapper">
            <button type="button"
                    class="btn btn-link btn-sm speaker-voucher-icon-btn speaker-voucher-info"
                    aria-label="{% if sent_at %}{% blocktranslate trimmed with date=sent_at|date:'j M Y' code=code %}Voucher details: sent {{ date }}, code {{ code }}{% endblocktranslate %}{% else %}{% blocktranslate trimmed with code=code %}Voucher code {{ code }}{% endblocktranslate %}{% endif %}"
                    aria-describedby="speaker-voucher-help-{{ assignment.pk }}">
                <i class="fa fa-info-circle" aria-hidden="true"></i>
            </button>
            <span id="speaker-voucher-help-{{ assignment.pk }}" class="speaker-voucher-info-box" role="tooltip">
                {% if sent_at %}
                    <span class="speaker-voucher-info-sent">{% blocktranslate trimmed with date=sent_at|date:'j M Y' %}Sent {{ date }}{% endblocktranslate %}</span>
                {% endif %}
                <span class="speaker-voucher-info-code-row">
                    <code class="speaker-voucher-info-code">{{ code }}</code>
                    <button type="button"
                            class="btn btn-sm btn-outline-secondary speaker-voucher-code-copy copyable-text"
                            data-destination="{{ code }}"
                            title="{% translate 'Copy voucher code' %}"
                            aria-label="{% translate 'Copy voucher code' %}">
                        <i class="fa fa-copy" aria-hidden="true"></i>
                    </button>
                </span>
            </span>
        </span>
    {% endwith %}
{% endif %}
