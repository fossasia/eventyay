{% load i18n %}

{% if profile.social_links.all or social_links %}
    <div class="speaker-social-links">
        {% for link in social_links|default:profile.social_links.all %}
            <span class="mr-3 mb-1 d-inline-block">
                {% if link.spec.icon_class %}<i class="fa {{ link.spec.icon_class }}"></i>{% endif %}
                <strong>{{ link.get_network_display }}:</strong>
                <a href="{{ link.url }}" target="_blank" rel="noopener noreferrer">{{ link.url }}</a>
            </span>
        {% endfor %}
    </div>
{% endif %}
