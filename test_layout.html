<!DOCTYPE html>
<html>
<head>
<style>
.advanced-filter-search {
  display: block;
  margin-bottom: 15px;
}
.advanced-filter-go-form {
  float: left;
  margin-right: 12px;
  margin-bottom: 12px;
}
.advanced-filter-search-form {
  display: block;
}
.advanced-filter-search-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: stretch;
}
.advanced-filter-advanced {
  clear: both;
  border: 1px solid #ddd;
  background: #fafafa;
  padding: 12px;
}
</style>
</head>
<body>
<div class="advanced-filter-search">
  <form class="advanced-filter-go-form">
    <input type="text" placeholder="Order code">
    <button>Go!</button>
  </form>
  <form class="filter-form advanced-filter-search-form">
    <div class="advanced-filter-search-bar">
      <input type="text" placeholder="Search orders..." style="flex: 1 1 0; min-width: 0;">
      <button>Search</button>
      <button>Filters</button>
    </div>
    <div class="advanced-filter-advanced">
      Full width advanced filter box
    </div>
  </form>
</div>
</body>
</html>
